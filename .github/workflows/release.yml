name: Release

# Creating a GitHub Release (tag vX.Y.Z) publishes the images of the services the plugins run as (GHCR, amd64 + arm64):
#   ghcr.io/lbdudc/linea-flamapy   ghcr.io/lbdudc/linea-agents   ghcr.io/lbdudc/linea-mcp
# and @lbdudc/linea-plugin-mcp on npm (trusted publishing, no token: the trusted publisher of the package is lbdudc/linea-plugins + release.yml).
# The package version is the tag's.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: linea-flamapy
            context: analytics-plugin/service
          - name: linea-agents
            context: agents-plugin/service/server
          - name: linea-mcp
            context: mcp-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lbdudc/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  npm-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci && npm run build
        working-directory: mcp-plugin
      - name: Version = the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: mcp-plugin
      - name: Publish unless this version is on npm already
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@lbdudc/linea-plugin-mcp@$version" version >/dev/null 2>&1; then echo "already on npm"; else npm publish --access public; fi
        working-directory: mcp-plugin
